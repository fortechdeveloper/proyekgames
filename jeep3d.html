<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#0a1e3d" />
<title>Off-Road Jeep 3D — GamehubFortechdev</title>

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
  crossorigin="anonymous"
  referrerpolicy="no-referrer"
/>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
:root{
  --text:#f4f9ff;
  --text-dim:rgba(244,249,255,.72);
  --text-soft:rgba(244,249,255,.52);
  --glass:rgba(20,40,75,.52);
  --glass-2:rgba(20,40,75,.65);
  --glass-border:rgba(255,255,255,.22);
  --ease:cubic-bezier(.22,.9,.28,1);
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:100%;height:100%;overflow:hidden;
  background:#06121f;
  font-family:'Segoe UI',system-ui,-apple-system,'SF Pro Display','Helvetica Neue',Arial,sans-serif;
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  touch-action:none;
  overscroll-behavior:none;
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none}
button{
  font:inherit;color:inherit;background:none;border:none;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
}
a{color:inherit;text-decoration:none}
i.fa-solid,i.fa-regular,i.fa-brands{line-height:1}

.glass{
  background:var(--glass);
  backdrop-filter:blur(16px) saturate(1.7);
  -webkit-backdrop-filter:blur(16px) saturate(1.7);
  border:1px solid var(--glass-border);
  box-shadow:
    0 8px 24px rgba(2,10,25,.42),
    inset 0 1px 0 rgba(255,255,255,.28);
}

.topbar{
  position:fixed;
  top:calc(var(--safe-t) + 12px);
  left:calc(var(--safe-l) + 12px);
  right:calc(var(--safe-r) + 12px);
  display:flex;align-items:center;gap:10px;
  padding:8px 12px;
  border-radius:16px;
  z-index:10;
  pointer-events:none;
}
.topbar .icon-btn{
  width:38px;height:38px;flex:none;
  border-radius:11px;
  display:grid;place-items:center;
  background:var(--glass);
  border:1px solid var(--glass-border);
  color:#fff;
  box-shadow:
    0 4px 12px rgba(2,10,25,.35),
    inset 0 1px 0 rgba(255,255,255,.28);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  pointer-events:auto;
  transition:transform .2s var(--ease);
}
.topbar .icon-btn:active{transform:scale(.9)}
.topbar .icon-btn i{font-size:14px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.title-box{flex:1;min-width:0}
.title-box h1{
  font-size:14px;font-weight:800;letter-spacing:-.2px;color:#fff;
  text-shadow:0 1px 3px rgba(0,0,0,.5);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.title-box span{
  display:block;
  font-size:9.5px;font-weight:700;letter-spacing:.6px;
  text-transform:uppercase;
  color:var(--text-soft);
  text-shadow:0 1px 2px rgba(0,0,0,.4);
}

.speedo{
  position:fixed;
  left:calc(var(--safe-l) + 14px);
  bottom:calc(var(--safe-b) + 218px);
  width:104px;height:104px;
  border-radius:50%;
  z-index:10;
  padding:6px;
  display:grid;place-items:center;
  pointer-events:none;
  box-shadow:
    0 10px 26px rgba(2,10,25,.5),
    inset 0 1px 0 rgba(255,255,255,.28),
    inset 0 -2px 8px rgba(0,0,0,.25);
}
.speedo svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(135deg)}
.speedo svg circle{fill:none;stroke-linecap:round}
.speedo .track{stroke:rgba(255,255,255,.12);stroke-width:7}
.speedo .ticks{stroke:rgba(255,255,255,.20);stroke-width:2}
.speedo .fill{
  stroke:#6ba3f7;stroke-width:7;
  stroke-dasharray:220;stroke-dashoffset:220;
  transition:stroke-dashoffset .08s linear, stroke .2s ease;
  filter:drop-shadow(0 0 8px rgba(107,163,247,.9));
}
.speedo .txt{text-align:center;line-height:1;z-index:1}
.speedo .txt b{
  display:block;font-size:23px;font-weight:900;letter-spacing:-1px;
  color:#fff;
  text-shadow:0 2px 6px rgba(0,0,0,.7);
  font-variant-numeric:tabular-nums;
}
.speedo .txt span{
  font-size:8.5px;font-weight:800;letter-spacing:.9px;
  text-transform:uppercase;
  color:var(--text-soft);
  text-shadow:0 1px 2px rgba(0,0,0,.5);
}

.gear{
  position:fixed;
  left:calc(var(--safe-l) + 128px);
  bottom:calc(var(--safe-b) + 244px);
  padding:8px 14px;
  border-radius:12px;
  font-size:13px;font-weight:900;letter-spacing:1px;
  color:#fff;
  z-index:10;
  pointer-events:none;
  text-shadow:0 2px 4px rgba(0,0,0,.6);
  min-width:44px;text-align:center;
  transition:color .2s ease;
  box-shadow:
    0 8px 20px rgba(2,10,25,.5),
    inset 0 1px 0 rgba(255,255,255,.25);
}
.gear::before{
  content:'';
  position:absolute;
  left:50%;bottom:-4px;
  transform:translateX(-50%);
  width:6px;height:6px;
  border-radius:50%;
  background:currentColor;
  box-shadow:0 0 8px currentColor;
}
.gear[data-state="D"]{color:#86efac}
.gear[data-state="R"]{color:#fca5a5}
.gear[data-state="N"]{color:#fde68a}

.rpm-bar{
  position:fixed;
  left:calc(var(--safe-l) + 14px);
  right:calc(var(--safe-r) + 14px);
  bottom:calc(var(--safe-b) + 190px);
  height:6px;
  border-radius:99px;
  z-index:10;
  pointer-events:none;
  overflow:hidden;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.15);
  box-shadow:inset 0 1px 3px rgba(0,0,0,.35);
}
.rpm-fill{
  height:100%;width:0%;
  border-radius:99px;
  background:linear-gradient(90deg,#6ba3f7 0%,#86efac 40%,#fde68a 70%,#f87171 100%);
  transition:width .08s linear;
  box-shadow:0 0 10px rgba(134,239,172,.6);
  position:relative;
}
.rpm-fill::after{
  content:'';
  position:absolute;
  right:0;top:0;bottom:0;
  width:8px;
  background:rgba(255,255,255,.9);
  filter:blur(3px);
  border-radius:99px;
}

.bottom-grad{
  position:fixed;
  left:0;right:0;bottom:0;
  height:240px;
  z-index:5;
  pointer-events:none;
  background:linear-gradient(
    180deg,
    rgba(6,18,38,0) 0%,
    rgba(6,18,38,.30) 40%,
    rgba(6,18,38,.65) 75%,
    rgba(6,18,38,.85) 100%
  );
}

.controls{
  position:fixed;
  left:calc(var(--safe-l) + 12px);
  right:calc(var(--safe-r) + 12px);
  bottom:calc(var(--safe-b) + 24px);
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:12px;
  z-index:10;
  pointer-events:none;
}
.steer-panel{
  display:flex;gap:8px;padding:8px;
  border-radius:20px;
  pointer-events:auto;
  background:var(--glass-2);
  border:1px solid var(--glass-border);
  backdrop-filter:blur(16px) saturate(1.7);
  -webkit-backdrop-filter:blur(16px) saturate(1.7);
  box-shadow:
    0 10px 28px rgba(2,10,25,.45),
    inset 0 1px 0 rgba(255,255,255,.28),
    inset 0 -2px 8px rgba(0,0,0,.22);
}
.steer-panel button{
  width:62px;height:62px;
  border-radius:15px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;
  background:linear-gradient(160deg, rgba(255,255,255,.16), rgba(255,255,255,.06));
  border:1px solid rgba(255,255,255,.24);
  color:#fff;
  box-shadow:
    0 4px 12px rgba(0,0,0,.30),
    inset 0 1px 0 rgba(255,255,255,.35),
    inset 0 -3px 6px rgba(0,0,0,.18);
  transition:transform .08s var(--ease), background .08s var(--ease), box-shadow .08s var(--ease);
  position:relative;
  overflow:hidden;
  will-change:transform;
}
.steer-panel button::before{
  content:'';
  position:absolute;
  inset:0;
  border-radius:inherit;
  background:radial-gradient(circle at 50% 15%, rgba(255,255,255,.28) 0%, transparent 55%);
  pointer-events:none;
}
.steer-panel button i{font-size:22px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.5));pointer-events:none}
.steer-panel button .lbl{
  font-size:8.5px;font-weight:800;letter-spacing:.6px;
  text-transform:uppercase;
  color:rgba(255,255,255,.72);
  text-shadow:0 1px 2px rgba(0,0,0,.6);
  pointer-events:none;
}
.steer-panel button.active{
  background:linear-gradient(160deg, rgba(107,163,247,.65), rgba(59,130,246,.42));
  box-shadow:
    0 2px 6px rgba(0,0,0,.35),
    inset 0 2px 4px rgba(0,0,0,.25),
    inset 0 -1px 2px rgba(255,255,255,.15);
  transform:scale(.93);
}

.pedals{
  display:flex;
  gap:8px;
  align-items:flex-end;
  padding:8px;
  border-radius:20px;
  pointer-events:auto;
  background:var(--glass-2);
  border:1px solid var(--glass-border);
  backdrop-filter:blur(16px) saturate(1.7);
  -webkit-backdrop-filter:blur(16px) saturate(1.7);
  box-shadow:
    0 10px 28px rgba(2,10,25,.45),
    inset 0 1px 0 rgba(255,255,255,.28),
    inset 0 -2px 8px rgba(0,0,0,.22);
}
.pedals button{
  border-radius:15px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;
  color:#fff;
  border:1px solid rgba(255,255,255,.24);
  box-shadow:
    0 4px 12px rgba(0,0,0,.30),
    inset 0 1px 0 rgba(255,255,255,.35),
    inset 0 -3px 6px rgba(0,0,0,.20);
  transition:transform .08s var(--ease), background .08s var(--ease), box-shadow .08s var(--ease);
  position:relative;
  overflow:hidden;
  will-change:transform;
}
.pedals button::before{
  content:'';
  position:absolute;
  inset:0;
  border-radius:inherit;
  background:radial-gradient(circle at 50% 15%, rgba(255,255,255,.28) 0%, transparent 55%);
  pointer-events:none;
}
.pedals button i{font-size:18px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.5));pointer-events:none}
.pedals button .lbl{
  font-size:8.5px;font-weight:800;letter-spacing:.6px;
  text-transform:uppercase;
  text-shadow:0 1px 2px rgba(0,0,0,.6);
  pointer-events:none;
}
.pedals .hb{
  width:48px;height:48px;
  background:linear-gradient(160deg, rgba(253,230,138,.28), rgba(253,230,138,.10));
}
.pedals .hb .lbl{color:rgba(253,230,138,.95)}
.pedals .brake{
  width:60px;height:60px;
  background:linear-gradient(160deg, rgba(217,79,107,.38), rgba(217,79,107,.15));
}
.pedals .brake .lbl{color:rgba(252,165,165,.95)}
.pedals .gas{
  width:74px;height:74px;
  background:linear-gradient(160deg, rgba(34,197,94,.38), rgba(34,197,94,.15));
}
.pedals .gas .lbl{color:rgba(134,239,172,.95)}
.pedals .gas i{font-size:22px}
.pedals button.active{
  transform:scale(.91);
  box-shadow:
    0 2px 6px rgba(0,0,0,.35),
    inset 0 2px 5px rgba(0,0,0,.30),
    inset 0 -1px 2px rgba(255,255,255,.15);
}
.pedals .gas.active{background:linear-gradient(160deg, rgba(34,197,94,.75), rgba(34,197,94,.45))}
.pedals .brake.active{background:linear-gradient(160deg, rgba(217,79,107,.75), rgba(217,79,107,.45))}
.pedals .hb.active{background:linear-gradient(160deg, rgba(253,230,138,.75), rgba(253,230,138,.45))}

.overlay{
  position:fixed;inset:0;
  z-index:50;
  display:grid;place-items:center;
  padding:24px;
  background:rgba(6,20,42,.82);
  backdrop-filter:blur(20px) saturate(1.4);
  -webkit-backdrop-filter:blur(20px) saturate(1.4);
  opacity:1;
  transition:opacity .35s var(--ease), visibility .35s var(--ease);
  text-align:center;
}
.overlay.hide{opacity:0;visibility:hidden;pointer-events:none}
.overlay-card{max-width:340px}
.overlay-icon{
  width:66px;height:66px;
  margin:0 auto 16px;
  border-radius:20px;
  display:grid;place-items:center;
  background:linear-gradient(140deg,#4ade80,#0ea56b);
  box-shadow:
    0 14px 32px -8px rgba(14,165,107,.7),
    inset 0 1px 0 rgba(255,255,255,.45);
  color:#fff;
  border:1px solid rgba(255,255,255,.30);
}
.overlay-icon i{font-size:28px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
.overlay h2{
  font-size:23px;font-weight:800;letter-spacing:-.5px;
  color:#fff;margin-bottom:10px;
  text-shadow:0 2px 12px rgba(0,0,0,.5);
}
.overlay p{
  font-size:13px;line-height:1.7;
  color:var(--text-dim);
  margin-bottom:20px;
  text-shadow:0 1px 2px rgba(0,0,0,.4);
}
.overlay .keys{
  display:flex;gap:6px;
  justify-content:center;flex-wrap:wrap;
  margin-bottom:20px;
}
.overlay .keys span{
  font-size:10px;font-weight:800;
  padding:5px 9px;border-radius:8px;
  background:rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.20);
  color:#fff;
  letter-spacing:.3px;
}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 28px;
  border-radius:14px;
  font-size:14.5px;font-weight:800;letter-spacing:.2px;
  color:#fff;
  background:linear-gradient(135deg,#4ade80,#0ea56b);
  box-shadow:
    0 12px 28px -8px rgba(14,165,107,.8),
    inset 0 1px 0 rgba(255,255,255,.35);
  border:1px solid rgba(255,255,255,.28);
  transition:transform .2s var(--ease);
  cursor:pointer;
}
.btn:active{transform:scale(.955)}
.btn i{font-size:13px}

.toast{
  position:fixed;
  left:50%;
  bottom:calc(var(--safe-b) + 300px);
  transform:translate(-50%,20px);
  padding:10px 18px;
  border-radius:13px;
  background:rgba(6,20,42,.94);
  color:#fff;
  font-size:13px;font-weight:700;
  opacity:0;visibility:hidden;
  transition:opacity .3s var(--ease), transform .3s var(--ease), visibility .3s var(--ease);
  z-index:60;pointer-events:none;
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  max-width:88vw;text-align:center;
  border:1px solid rgba(255,255,255,.15);
  box-shadow:0 12px 28px rgba(0,0,0,.5);
}
.toast.show{opacity:1;visibility:visible;transform:translate(-50%,0)}

@media (min-width:640px){
  .speedo{width:118px;height:118px;bottom:calc(var(--safe-b) + 240px);left:calc(var(--safe-l) + 20px)}
  .speedo .txt b{font-size:26px}
  .gear{left:calc(var(--safe-l) + 152px);bottom:calc(var(--safe-b) + 268px);font-size:14px;padding:9px 16px}
  .rpm-bar{bottom:calc(var(--safe-b) + 210px);height:7px}
  .controls{bottom:calc(var(--safe-b) + 32px);gap:16px}
  .steer-panel{padding:10px;gap:10px}
  .steer-panel button{width:70px;height:70px}
  .steer-panel button i{font-size:24px}
  .pedals{padding:10px;gap:10px}
  .pedals .gas{width:82px;height:82px}
  .pedals .brake{width:68px;height:68px}
  .pedals .hb{width:54px;height:54px}
}
@media (max-height:500px) and (orientation:landscape){
  .speedo{width:80px;height:80px;bottom:calc(var(--safe-b) + 12px);top:auto}
  .speedo .txt b{font-size:18px}
  .gear{left:calc(var(--safe-l) + 100px);bottom:calc(var(--safe-b) + 26px)}
  .rpm-bar{display:none}
  .controls{bottom:calc(var(--safe-b) + 12px)}
  .steer-panel button{width:56px;height:56px}
  .pedals .gas{width:62px;height:62px}
  .pedals .brake{width:52px;height:52px}
  .pedals .hb{width:42px;height:42px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important;}
}
</style>
</head>

<body>

<canvas id="scene"></canvas>

<div class="bottom-grad"></div>

<header class="topbar glass">
  <a class="icon-btn" href="index.html" aria-label="Kembali">
    <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
  </a>
  <div class="title-box">
    <h1>Off-Road Jeep 3D</h1>
    <span id="statusTxt">Loading map…</span>
  </div>
  <button class="icon-btn" id="camBtn" aria-label="Ganti kamera">
    <i class="fa-solid fa-video" aria-hidden="true"></i>
  </button>
</header>

<div class="speedo glass" id="speedo">
  <svg viewBox="0 0 100 100">
    <circle class="track" cx="50" cy="50" r="35" />
    <g class="ticks">
      <line x1="50" y1="8" x2="50" y2="14" />
      <line x1="85" y1="30" x2="79" y2="34" />
      <line x1="85" y1="70" x2="79" y2="66" />
      <line x1="15" y1="30" x2="21" y2="34" />
      <line x1="15" y1="70" x2="21" y2="66" />
    </g>
    <circle class="fill" id="speedFill" cx="50" cy="50" r="35" />
  </svg>
  <div class="txt">
    <b id="spdVal">0</b>
    <span>km/h</span>
  </div>
</div>

<div class="gear glass" id="gearBox" data-state="N">N</div>

<div class="rpm-bar">
  <div class="rpm-fill" id="rpmFill"></div>
</div>

<div class="controls">
  <div class="steer-panel">
    <button id="btnLeft" aria-label="Kiri">
      <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
      <span class="lbl">Left</span>
    </button>
    <button id="btnRight" aria-label="Kanan">
      <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
      <span class="lbl">Right</span>
    </button>
  </div>
  <div class="pedals">
    <button class="hb" id="btnHB" aria-label="Handbrake">
      <i class="fa-solid fa-hand" aria-hidden="true"></i>
      <span class="lbl">HB</span>
    </button>
    <button class="brake" id="btnBrake" aria-label="Rem">
      <i class="fa-solid fa-circle-stop" aria-hidden="true"></i>
      <span class="lbl">Rem</span>
    </button>
    <button class="gas" id="btnGas" aria-label="Gas">
      <i class="fa-solid fa-arrow-up" aria-hidden="true"></i>
      <span class="lbl">Gas</span>
    </button>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="overlay" id="overlay">
  <div class="overlay-card">
    <div class="overlay-icon">
      <i class="fa-solid fa-truck-monster" aria-hidden="true"></i>
    </div>
    <h2>Off-Road Jeep 3D</h2>
    <p>Bawa jeep keliling map. Kontrol di layar atau pakai keyboard.</p>
    <div class="keys">
      <span>W / ↑ GAS</span>
      <span>S / ↓ REM</span>
      <span>A D / ← → STEER</span>
      <span>SPACE HB</span>
    </div>
    <button class="btn" id="ovlBtn">
      <i class="fa-solid fa-play" aria-hidden="true"></i>
      Mulai Main
    </button>
  </div>
</div>

<script>
/* =========================================================
   OFF-ROAD JEEP 3D v4 — GamehubFortechdev
   Kontrol ultra responsif (pointer capture, no lag)
   ========================================================= */
(function () {
  'use strict';

  if (typeof THREE === 'undefined') {
    document.querySelector('.overlay h2').textContent = 'Gagal memuat 3D engine';
    document.querySelector('.overlay p').textContent = 'Butuh koneksi internet untuk load Three.js.';
    return;
  }

  const cvs       = document.getElementById('scene');
  const overlay   = document.getElementById('overlay');
  const ovlBtn    = document.getElementById('ovlBtn');
  const spdValEl  = document.getElementById('spdVal');
  const speedFill = document.getElementById('speedFill');
  const gearBox   = document.getElementById('gearBox');
  const rpmFill   = document.getElementById('rpmFill');
  const statusTxt = document.getElementById('statusTxt');
  const camBtn    = document.getElementById('camBtn');
  const toastEl   = document.getElementById('toast');

  /* =========================================================
     CONFIG — responsif
     ========================================================= */
  const MAP_SIZE    = 160;
  const MAX_SPEED   = 30;

     ========================================================= */
  function makeGroundTexture() {
    const c = document.createElement('canvas');
    c.width = c.height = 1024;
    const ctx = c.getContext('2d');

    const g = ctx.createLinearGradient(0, 0, 1024, 1024);
    g.addColorStop(0, '#3e7049');
    g.addColorStop(0.4, '#376843');
    g.addColorStop(1, '#2b5238');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 1024, 1024);

    for (let i = 0; i < 900; i++) {
      const x = Math.random() * 1024;
      const y = Math.random() * 1024;
      const r = 6 + Math.random() * 55;
      const shade = ['#4a7a52','#2a4a2f','#3c6a44','#568a5e','#254526'][(Math.random()*5)|0];
      ctx.globalAlpha = 0.15 + Math.random() * 0.22;
      ctx.fillStyle = shade;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.globalAlpha = 0.55;
    for (let i = 0; i < 3000; i++) {
      const x = Math.random() * 1024;
      const y = Math.random() * 1024;
      ctx.strokeStyle = Math.random() < 0.5 ? '#2d5535' : '#4d7d55';
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + (Math.random()-0.5)*3, y - 3 - Math.random()*3);
      ctx.stroke();
    }

    ctx.globalAlpha = 0.7;
    for (let i = 0; i < 90; i++) {
      const x = Math.random() * 1024;
      const y = Math.random() * 1024;
      const col = ['#f4d35e','#f7c8d8','#e1c7f5','#ffffff'][(Math.random()*4)|0];
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(x, y, 1.6 + Math.random()*1.2, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.globalAlpha = 0.08;
    for (let i = 0; i < 15000; i++) {
      ctx.fillStyle = Math.random() < 0.5 ? '#000' : '#fff';
      ctx.fillRect(Math.random() * 1024, Math.random() * 1024, 1.3, 1.3);
    }

    ctx.globalAlpha = 1;
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(10, 10);
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return tex;
  }

  /* ---------------- ROAD ---------------- */
  function makeRoadTexture() {
    const c = document.createElement('canvas');
    c.width = 512; c.height = 512;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#2c2f36';
    ctx.fillRect(0, 0, 512, 512);

    for (let i = 0; i < 12000; i++) {
      const v = Math.random() * 50 | 0;
      ctx.fillStyle = `rgba(${v},${v},${v},0.4)`;
      ctx.fillRect(Math.random() * 512, Math.random() * 512, 1.6, 1.6);
    }
    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
    ctx.lineWidth = 0.6;
    for (let i = 0; i < 60; i++) {
      ctx.beginPath();
      let x = Math.random() * 512;
      let y = Math.random() * 512;
      ctx.moveTo(x, y);
      for (let k = 0; k < 4; k++) {
        x += (Math.random()-0.5) * 40;
        y += (Math.random()-0.5) * 40;
        ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    ctx.fillStyle = 'rgba(240,220,120,.75)';
    for (let i = 0; i < 512; i += 60) ctx.fillRect(250, i, 12, 34);

    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(1, 24);
    return t;
  }

  /* ---------------- ROCK ---------------- */
  const rockMat = new THREE.MeshStandardMaterial({ color: 0x777a80, roughness: 0.96 });

  function makeRock(scale) {
    const geo = new THREE.IcosahedronGeometry(0.6 + Math.random() * 0.5, 0);
    const pos = geo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      pos.setXYZ(
        i,
        pos.getX(i) * (0.8 + Math.random() * 0.5),
        pos.getY(i) * (0.55 + Math.random() * 0.4),
        pos.getZ(i) * (0.8 + Math.random() * 0.5)
      );
    }
    geo.computeVertexNormals();
    const mats = [rockMat, rockMat2, rockMat3];
    const m = new THREE.Mesh(geo, mats[(Math.random() * 3) | 0]);
    m.scale.setScalar(scale || 1);
    m.castShadow = true; m.receiveShadow = true;
    return m;

  /* ---------------- BUILDING ---------------- */
  const glassWinMat = new THREE.MeshStandardMaterial({

  function makeBuilding(w, h, d, color) {
    const g = new THREE.Group();

    const wallMat = new THREE.MeshStandardMaterial({
      color, roughness: 0.85, metalness: 0.05,
    });

    const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
    body.position.y = h / 2;
    body.castShadow = true; body.receiveShadow = true;
    g.add(body);

    const roofMat = new THREE.MeshStandardMaterial({ color: 0x2e2c2c, roughness: 0.9 });
    const roof = new THREE.Mesh(new THREE.BoxGeometry(w * 1.06, 0.35, d * 1.06), roofMat);
    roof.position.y = h + 0.17;
    roof.castShadow = true; roof.receiveShadow = true;
    g.add(roof);

    const border = new THREE.Mesh(
      new THREE.BoxGeometry(w * 1.08, 0.12, d * 1.08),
      new THREE.MeshStandardMaterial({ color: 0x1a1919, roughness: 0.85 })
    );
    border.position.y = h + 0.36;
    g.add(border);

    if (Math.random() < 0.7) {
      const ac = new THREE.Mesh(
        new THREE.BoxGeometry(1.2, 0.5, 0.9),
        new THREE.MeshStandardMaterial({ color: 0x8b8d92, metalness: 0.6, roughness: 0.5 })
      );
      ac.position.set((Math.random()-0.5) * (w*0.5), h + 0.6, (Math.random()-0.5) * (d*0.5));
      ac.castShadow = true;
      g.add(ac);
    }

    if (Math.random() < 0.5) {
      const ch = new THREE.Mesh(
        new THREE.CylinderGeometry(0.35, 0.4, 1.3, 8),
        new THREE.MeshStandardMaterial({ color: 0x5c4a3a, roughness: 0.9 })
      );
      ch.position.set(w * 0.35, h + 0.9, -d * 0.3);
      ch.castShadow = true;
      g.add(ch);
    }

    const rows = Math.max(1, Math.floor(h / 3));
    const cols = Math.max(2, Math.floor(w / 2.5));
    const winW = 0.9, winH = 1.2;
    for (let r = 0; r < rows; r++) {
      const y = 1.2 + r * 2.8;
      if (y > h - 0.8) break;
      for (let c = 0; c < cols; c++) {
        const x = -w / 2 + 1.2 + c * ((w - 2.4) / (cols - 1 || 1));
        const wFront = new THREE.Mesh(new THREE.BoxGeometry(winW, winH, 0.1), glassWinMat);
        wFront.position.set(x, y, d / 2 + 0.05);
        g.add(wFront);
        const wBack = wFront.clone();
        wBack.position.z = -d / 2 - 0.05;
        g.add(wBack);
      }
    }

    const door = new THREE.Mesh(new THREE.BoxGeometry(1.2, 2.2, 0.12), doorMat);
    door.position.set(0, 1.1, d / 2 + 0.06);
    g.add(door);
    const handle = new THREE.Mesh(
      new THREE.BoxGeometry(0.35, 0.06, 0.06),
      new THREE.MeshStandardMaterial({ color: 0xc9cfd6, metalness: 0.9, roughness: 0.2 })
    );
    handle.position.set(0.4, 1.15, d / 2 + 0.14);
    g.add(handle);

    return g;
  }

  function makeWaterTower() {

    const tankMat = new THREE.MeshStandardMaterial({ color: 0xa8b0b8, metalness: 0.5, roughness: 0.55 });

  function makeFence(length) {
    const g = new THREE.Group();
    const postMat = new THREE.MeshStandardMaterial({ color: 0x6b5b45, roughness: 0.9 });
    const railMat = new THREE.MeshStandardMaterial({ color: 0x7d6a4f, roughness: 0.9 });
    const step = 3;
    const count = Math.floor(length / step);
    for (let i = 0; i <= count; i++) {
      const post = new THREE.Mesh(new THREE.BoxGeometry(0.14, 1.2, 0.14), postMat);
      post.position.set(-length / 2 + i * step, 0.6, 0);
      post.castShadow = true;
      g.add(post);

    [0.4, 0.85].forEach((y) => {
      const rail = new THREE.Mesh(new THREE.BoxGeometry(length, 0.09, 0.09), railMat);
      rail.position.set(0, y, 0);
      rail.castShadow = true;
      g.add(rail);

  /* =========================================================
     SCATTER MAP
     ========================================================= */
  const obstacles = [];

  for (let i = 0; i < 130; i++) {
    const x = (Math.random() - 0.5) * MAP_SIZE * 0.95;
    const z = (Math.random() - 0.5) * MAP_SIZE * 0.95;
    if (Math.abs(x) < 7 || Math.abs(z) < 7) continue;
    let t;
    const rnd = Math.random();
    if (rnd < 0.55) t = makePineTree();
    else if (rnd < 0.85) t = makeOakTree();
    else t = makeDeadTree();
    t.position.set(x, 0, z);
    t.rotation.y = Math.random() * Math.PI * 2;
    const s = 0.75 + Math.random() * 0.7;
    t.scale.setScalar(s);
    scene.add(t);
    obstacles.push({ x, z, r: 0.55 * s });

  chassisGroup.add(snorkel);

  const snorkelHead = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.2, 10), darkMat);
  snorkelHead.position.set(-0.82, 2.28, -0.85);
  chassisGroup.add(snorkelHead);

  for (let y = 1.2; y < 2.2; y += 0.4) {
    const br = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.03, 0.03), darkMat);
    br.position.set(-0.86, y, -0.85);
    chassisGroup.add(br);
  }

  const antenna = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.006, 1.4, 6), darkMat);
  antenna.position.set(0.65, 1.35, 1.65);
  antenna.rotation.z = -0.15;
  chassisGroup.add(antenna);

  const exhaust = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, 0.6, 10), chromeMat);
  exhaust.rotation.z = Math.PI / 2;
  exhaust.position.set(0.65, 0.7, 2.1);
  chassisGroup.add(exhaust);

  const exhaustTip = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.06, 0.15, 12), chromeMat);
  exhaustTip.rotation.z = Math.PI / 2;
  exhaustTip.position.set(0.98, 0.7, 2.1);
  chassisGroup.add(exhaustTip);

  (function addJerryCan() {
    const g = new THREE.Group();
    const canMat = new THREE.MeshStandardMaterial({ color: 0x8b2020, roughness: 0.6, metalness: 0.3 });
    const can = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.45, 0.18), canMat);
    can.castShadow = true;
    g.add(can);

    const handleMat = new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.7 });
    const handle = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.05, 0.18), handleMat);
    handle.position.set(0, 0.24, 0);
    g.add(handle);

    const cap = new THREE.Mesh(
      new THREE.CylinderGeometry(0.04, 0.04, 0.06, 8),
      new THREE.MeshStandardMaterial({ color: 0x2a2a2a })
    );
    cap.position.set(-0.12, 0.22, 0.02);
    cap.rotation.x = Math.PI / 2;
    g.add(cap);

    const xMat = new THREE.MeshStandardMaterial({ color: 0xf5f5f5, roughness: 0.5 });
    const x1 = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.4, 0.02), xMat);
    x1.rotation.z = Math.PI / 4;
    x1.position.set(0, 0, 0.1);
    g.add(x1);
    const x2 = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.4, 0.02), xMat);
    x2.rotation.z = -Math.PI / 4;
    x2.position.set(0, 0, 0.1);
    g.add(x2);

    g.position.set(-0.7, 1.15, 2.3);
    g.rotation.y = 0.15;
    chassisGroup.add(g);
  })();

  const wheels = [];

  function createWheel(isFront) {
    const g = new THREE.Group();
    g.userData.isFront = isFront;

    const steerPivot = new THREE.Group();
    g.add(steerPivot);
    g.userData.pivot = steerPivot;

    const spin = new THREE.Group();
    steerPivot.add(spin);
    g.userData.spin = spin;

    const tire = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.36, 26), tireMat);
    tire.rotation.z = Math.PI / 2;
    tire.castShadow = true; tire.receiveShadow = true;
    spin.add(tire);

    const rimOuter = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.375, 20), rimMat);
    rimOuter.rotation.z = Math.PI / 2;
    spin.add(rimOuter);

    const rimInner = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.24, 0.30, 16), darkMat);
    rimInner.rotation.z = Math.PI / 2;
    spin.add(rimInner);

    const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.11, 0.42, 12), hubMat);
    hub.rotation.z = Math.PI / 2;
    spin.add(hub);

    for (let i = 0; i < 5; i++) {
      const ang = (i / 5) * Math.PI * 2;
      const spoke = new THREE.Mesh(new THREE.BoxGeometry(0.055, 0.06, 0.32), rimMat);
      spoke.position.set(0, Math.sin(ang) * 0.2, Math.cos(ang) * 0.2);
      spoke.rotation.x = ang;
      spin.add(spoke);
    }

    for (let i = 0; i < 5; i++) {
      const ang = (i / 5) * Math.PI * 2;
      const nut = new THREE.Mesh(new THREE.CylinderGeometry(0.028, 0.028, 0.05, 6), chromeMat);
      nut.rotation.z = Math.PI / 2;
      nut.position.set(0.16, Math.sin(ang) * 0.08, Math.cos(ang) * 0.08);
      spin.add(nut);
    }

    const disc = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.04, 20), brakeDiscMat);
    disc.rotation.z = Math.PI / 2;
    disc.position.set(-0.05, 0, 0);
    spin.add(disc);

    const caliper = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.14, 0.1), caliperMat);
    caliper.position.set(-0.06, 0.14, 0);
    spin.add(caliper);

    const treadCount = 22;
    for (let i = 0; i < treadCount; i++) {
      const a = (i / treadCount) * Math.PI * 2;
      const tx = Math.cos(a) * 0.51;
      const ty = Math.sin(a) * 0.51;
      const block = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.07, 0.09), tireMat);
      block.position.set(0, ty, tx);
      block.rotation.x = a;
      spin.add(block);
    }

    const valve = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, 0.06, 5), rubberMat);
    valve.position.set(0.06, 0.28, 0);
    spin.add(valve);

    return g;
  }

  const WB = 1.15;
  const TRACK = 0.94;

  const wFL = createWheel(true);  wFL.position.set(-TRACK, 0.5, -WB); jeep.add(wFL); wheels.push(wFL);
  const wFR = createWheel(true);  wFR.position.set( TRACK, 0.5, -WB); jeep.add(wFR); wheels.push(wFR);
  const wRL = createWheel(false); wRL.position.set(-TRACK, 0.5,  WB); jeep.add(wRL); wheels.push(wRL);
  const wRR = createWheel(false); wRR.position.set( TRACK, 0.5,  WB); jeep.add(wRR); wheels.push(wRR);

  const beam1 = new THREE.SpotLight(0xffe9a8, 0.9, 30, Math.PI / 6, 0.5, 1.5);
  beam1.position.set(-0.55, 1.08, -1.9);
  beam1.target.position.set(-0.55, 0, -9);
  chassisGroup.add(beam1);
  chassisGroup.add(beam1.target);

  const beam2 = new THREE.SpotLight(0xffe9a8, 0.9, 30, Math.PI / 6, 0.5, 1.5);
  beam2.position.set(0.55, 1.08, -1.9);
  beam2.target.position.set(0.55, 0, -9);
  chassisGroup.add(beam2);
  chassisGroup.add(beam2.target);

  /* =========================================================
     DUST
     ========================================================= */
  const DUST_MAX = 150;
  const dustGeo = new THREE.BufferGeometry();
  const dustPositions = new Float32Array(DUST_MAX * 3);
  const dustLife = new Float32Array(DUST_MAX);
  const dustVel  = new Float32Array(DUST_MAX * 3);

  for (let i = 0; i < DUST_MAX; i++) {
    dustPositions[i * 3 + 1] = -1000;
    dustLife[i] = 0;
  }
  dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPositions, 3));

  const dustMat = new THREE.PointsMaterial({
    color: 0xc4a87a,
    size: 0.48,
    transparent: true,
    opacity: 0.55,
    depthWrite: false,
    sizeAttenuation: true,
  });
  const dust = new THREE.Points(dustGeo, dustMat);
  scene.add(dust);

  let dustIdx = 0;
  function spawnDust(x, z) {
    const i = dustIdx;
    dustIdx = (dustIdx + 1) % DUST_MAX;
    dustPositions[i * 3]     = x + (Math.random() - 0.5) * 0.4;
    dustPositions[i * 3 + 1] = 0.15;
    dustPositions[i * 3 + 2] = z + (Math.random() - 0.5) * 0.4;
    dustVel[i * 3]     = (Math.random() - 0.5) * 1.2;
    dustVel[i * 3 + 1] = 0.6 + Math.random() * 0.6;
    dustVel[i * 3 + 2] = (Math.random() - 0.5) * 1.2;
    dustLife[i] = 1.0;
  }

  function updateDust(dt) {
    for (let i = 0; i < DUST_MAX; i++) {
      if (dustLife[i] <= 0) continue;
      dustLife[i] -= dt * 1.1;
      if (dustLife[i] <= 0) {
        dustPositions[i * 3 + 1] = -1000;
        continue;
      }
      dustPositions[i * 3]     += dustVel[i * 3]     * dt;
      dustPositions[i * 3 + 1] += dustVel[i * 3 + 1] * dt;
      dustPositions[i * 3 + 2] += dustVel[i * 3 + 2] * dt;
      dustVel[i * 3 + 1] *= 0.96;
    }
    dustGeo.attributes.position.needsUpdate = true;
  }

  /* =========================================================
     CAR STATE
     ========================================================= */
  const car = {
    x: 0, z: 0,
    angle: 0,
    speed: 0,
    lateral: 0,
    steer: 0,
    steerTarget: 0,
    wheelSpin: 0,
    bounce: 0,
    accelPitch: 0,
    rollAngle: 0,
    rpm: 0,
  };

  const input = {
    gas: false, brake: false,
    left: false, right: false,
    handbrake: false,
  };

  /* =========================================================
     INPUT — KEYBOARD
     ========================================================= */
  window.addEventListener('keydown', (e) => {
    switch (e.key) {
      case 'ArrowUp':    case 'w': case 'W': input.gas = true; e.preventDefault(); break;
      case 'ArrowDown':  case 's': case 'S': input.brake = true; e.preventDefault(); break;
      case 'ArrowLeft':  case 'a': case 'A': input.left = true; e.preventDefault(); break;
      case 'ArrowRight': case 'd': case 'D': input.right = true; e.preventDefault(); break;
      case ' ': case 'Spacebar': input.handbrake = true; e.preventDefault(); break;
    }
  });
  window.addEventListener('keyup', (e) => {
    switch (e.key) {
      case 'ArrowUp':    case 'w': case 'W': input.gas = false; break;
      case 'ArrowDown':  case 's': case 'S': input.brake = false; break;
      case 'ArrowLeft':  case 'a': case 'A': input.left = false; break;
      case 'ArrowRight': case 'd': case 'D': input.right = false; break;
      case ' ': case 'Spacebar': input.handbrake = false; break;
    }
  });

  /* =========================================================
     INPUT — TOUCH RESPONSIF
     Pakai Pointer Capture supaya tombol gak "lepas" saat jari geser.
     ========================================================= */
  function bindHold(id, key) {
    const el = document.getElementById(id);
    if (!el) return;

    const activePointers = new Set();

    const press = (e) => {
      e.preventDefault();
      e.stopPropagation();
      activePointers.add(e.pointerId);
      input[key] = true;
      el.classList.add('active');
      try { el.setPointerCapture(e.pointerId); } catch (_) {}
    };

    const release = (e) => {
      activePointers.delete(e.pointerId);
      if (activePointers.size === 0) {
        input[key] = false;
        el.classList.remove('active');
      }
      try { el.releasePointerCapture(e.pointerId); } catch (_) {}
    };

    // pointerdown → instant response
    el.addEventListener('pointerdown', press, { passive: false });
    el.addEventListener('pointerup', release);
    el.addEventListener('pointercancel', release);

    // Safety: kalau window kehilangan fokus, lepas semua
    el.addEventListener('lostpointercapture', release);

    // contextmenu & drag cegah
    el.addEventListener('contextmenu', (e) => e.preventDefault());
    el.addEventListener('dragstart', (e) => e.preventDefault());
  }

  bindHold('btnGas', 'gas');
  bindHold('btnBrake', 'brake');
  bindHold('btnLeft', 'left');
  bindHold('btnRight', 'right');
  bindHold('btnHB', 'handbrake');

  // Global: kalau semua jari diangkat, matikan semua input
  window.addEventListener('blur', () => {
    input.gas = input.brake = input.left = input.right = input.handbrake = false;
    ['btnGas','btnBrake','btnLeft','btnRight','btnHB'].forEach((id) => {
      const el = document.getElementById(id);
      if (el) el.classList.remove('active');
    });
  });

  /* =========================================================
     UPDATE CAR
     ========================================================= */
  function updateCar(dt) {
    // Throttle / Brake / Reverse
    if (input.gas) {
      car.speed += ACCEL * dt;
    } else if (input.brake) {
      if (car.speed > 0.5) car.speed -= BRAKE * dt;
      else car.speed -= ACCEL * 0.75 * dt;
    } else {
      if (Math.abs(car.speed) > 0.1) {
        car.speed -= Math.sign(car.speed) * ENGINE_BRAKE * dt;
      } else {
        car.speed = 0;
      }
    }

    if (input.handbrake) car.speed *= 0.94;

    car.speed = Math.max(-MAX_REVERSE, Math.min(MAX_SPEED, car.speed));

    // Steering — instant responsif
    const target = (input.left ? 1 : 0) - (input.right ? 1 : 0);
    car.steerTarget = target;

    const steerRate = (target === 0) ? STEER_RETURN : STEER_RATE;
    car.steer += (target - car.steer) * Math.min(1, steerRate * dt);

    // Turn rate — speed factor lebih galak
    const speedFactor = Math.min(1, Math.abs(car.speed) / SPEED_DIV);
    const dirSign = car.speed >= 0 ? 1 : -1;
    const turnRate = car.steer * STEER_MAX * 2.4 * speedFactor * dirSign;
    car.angle += turnRate * dt;

    // Drift
    const drifting = Math.abs(car.steer) > 0.5 &&
                     Math.abs(car.speed) > 10 &&
                     (input.handbrake || Math.abs(car.steer) > 0.75);
    const targetLateral = drifting ? -car.steer * Math.abs(car.speed) * 0.15 : 0;
    car.lateral += (targetLateral - car.lateral) * Math.min(1, 6 * dt);
    if (!drifting) car.lateral *= 0.9;

    const forwardX = -Math.sin(car.angle);
    const forwardZ = -Math.cos(car.angle);
    const rightX = Math.cos(car.angle);
    const rightZ = -Math.sin(car.angle);

    const dx = forwardX * car.speed + rightX * car.lateral;
    const dz = forwardZ * car.speed + rightZ * car.lateral;

    car.x += dx * dt;
    car.z += dz * dt;

    const half = MAP_SIZE / 2 - 1.2;
    if (car.x < -half) { car.x = -half; car.speed *= 0.5; }
    if (car.x >  half) { car.x =  half; car.speed *= 0.5; }
    if (car.z < -half) { car.z = -half; car.speed *= 0.5; }
    if (car.z >  half) { car.z =  half; car.speed *= 0.5; }

    // Obstacle
    for (let i = 0; i < obstacles.length; i++) {
      const o = obstacles[i];
      const ox = car.x - o.x;
      const oz = car.z - o.z;
      const minD = o.r + 1.1;
      const d2 = ox * ox + oz * oz;
      if (d2 < minD * minD) {
        const d = Math.sqrt(d2) || 0.001;
        const nx = ox / d;
        const nz = oz / d;
        car.x = o.x + nx * minD;
        car.z = o.z + nz * minD;
        car.speed *= 0.4;
      }
    }

    // Visual
    car.wheelSpin += (car.speed / 0.5) * dt;

    const speedMag = Math.abs(car.speed);
    car.bounce = Math.sin(performance.now() * 0.012) * Math.min(0.05, speedMag * 0.0018);

    const accelDir = input.gas ? 1 : (input.brake ? -1 : 0);
    car.accelPitch += (accelDir * 0.05 - car.accelPitch) * Math.min(1, 6 * dt);

    const targetRoll = -car.steer * Math.min(0.18, speedMag * 0.010);
    car.rollAngle += (targetRoll - car.rollAngle) * Math.min(1, 8 * dt);

    const targetRpm = Math.min(1, (input.gas ? 0.35 : 0) + speedMag / MAX_SPEED * 0.85);
    car.rpm += (targetRpm - car.rpm) * Math.min(1, 8 * dt);

    jeep.position.set(car.x, 0, car.z);
    jeep.rotation.y = car.angle;

    chassisGroup.position.y = car.bounce;
    chassisGroup.rotation.z = car.rollAngle;
    chassisGroup.rotation.x = car.accelPitch;

    wheels.forEach((w) => {
      if (w.userData.isFront) {
        w.userData.pivot.rotation.y = car.steer * 0.55;
      }
      w.userData.spin.rotation.x = -car.wheelSpin;
    });

    const isFast = Math.abs(car.speed) > 8;
    const isDrifting = Math.abs(car.lateral) > 1.5;
    if ((isFast || isDrifting) && Math.random() < 0.6) {
      const bx = car.x - forwardX * 1.4;
      const bz = car.z - forwardZ * 1.4;
      spawnDust(bx + rightX * 0.8, bz + rightZ * 0.8);
      spawnDust(bx - rightX * 0.8, bz - rightZ * 0.8);
    }
    updateDust(dt);

    skidCooldown -= dt;
    if (isDrifting && skidCooldown <= 0) {
      skidCooldown = 0.04;
      [-0.9, 0.9].forEach((sideOffset) => {
        const px = car.x + rightX * sideOffset - forwardX * 1.1;
        const pz = car.z + rightZ * sideOffset - forwardZ * 1.1;
        spawnSkid(px, pz, -car.angle);
      });
    }
    updateSkids(dt);
  }

  /* ---------------- CAMERA ---------------- */
  let camMode = 'top';

  function updateCamera(dt) {
    let targetX, targetY, targetZ, lookX, lookY, lookZ;

    if (camMode === 'top') {
      targetX = car.x;
      targetY = 24;
      targetZ = car.z + 12;
      lookX = car.x;
      lookY = 0.5;
      lookZ = car.z - 2;
    } else {
      const fx = -Math.sin(car.angle);
      const fz = -Math.cos(car.angle);
      targetX = car.x - fx * 9;
      targetY = 6;
      targetZ = car.z - fz * 9;
      lookX = car.x + fx * 3;
      lookY = 1.2;
      lookZ = car.z + fz * 3;
    }

    const k = Math.min(1, 7 * dt);
    camera.position.x += (targetX - camera.position.x) * k;
    camera.position.y += (targetY - camera.position.y) * k;
    camera.position.z += (targetZ - camera.position.z) * k;
    camera.lookAt(lookX, lookY, lookZ);

    sun.position.set(car.x + 40, 70, car.z + 30);
    sun.target.position.set(car.x, 0, car.z);
    sun.target.updateMatrixWorld();
  }

  camBtn.addEventListener('click', () => {
    camMode = camMode === 'top' ? 'follow' : 'top';
    toast(camMode === 'top' ? 'Kamera: Top-Down' : 'Kamera: Follow', 1200);
  });

  /* ---------------- HUD ---------------- */
  let lastSpdKmh = -1;
  let lastGear = '';
  let lastRpmW = -1;

  function updateHUD() {
    const kmh = Math.round(Math.abs(car.speed) * 3.6);
    if (kmh !== lastSpdKmh) {
      spdValEl.textContent = kmh;
      lastSpdKmh = kmh;
    }

    const pct = Math.min(1, Math.abs(car.speed) / MAX_SPEED);
    speedFill.style.strokeDashoffset = String(220 - pct * 220);

    if (pct > 0.8) speedFill.style.stroke = '#f87171';
    else if (pct > 0.5) speedFill.style.stroke = '#fde68a';
    else speedFill.style.stroke = '#6ba3f7';

    let gear;
    if (car.speed < -0.5) gear = 'R';
    else if (Math.abs(car.speed) < 0.4) gear = 'N';
    else gear = 'D';
    if (gear !== lastGear) {
      gearBox.textContent = gear;
      gearBox.setAttribute('data-state', gear);
      lastGear = gear;
    }

    const rpmW = Math.round(car.rpm * 100);
    if (rpmW !== lastRpmW) {
      rpmFill.style.width = rpmW + '%';
      lastRpmW = rpmW;
    }
  }

  /* ---------------- LOOP ---------------- */
  let last = performance.now();
  let running = false;

  function frame(now) {
    requestAnimationFrame(frame);

    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.05) dt = 0.05;

    if (running) updateCar(dt);
    updateCamera(dt);
    updateHUD();

    renderer.render(scene, camera);
  }
  requestAnimationFrame(frame);

  /* ---------------- RESIZE ---------------- */
  function resize() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 150));

  /* ---------------- START ---------------- */
  ovlBtn.addEventListener('click', () => {
    overlay.classList.add('hide');
    running = true;
    last = performance.now();
    setTimeout(() => toast('Tekan GAS untuk jalan', 2000), 300);
  });

  let lastTouch = 0;
  document.addEventListener('touchend', (e) => {
    const n = Date.now();
    if (n - lastTouch < 320) e.preventDefault();
    lastTouch = n;
  }, { passive: false });

  document.querySelectorAll('img, svg, canvas').forEach((el) => el.setAttribute('draggable', 'false'));

  camera.position.set(0, 24, 12);
  camera.lookAt(0, 0, -2);

  statusTxt.textContent = 'Siap';

})();
</script>
