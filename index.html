<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#0a1e3d" />
<title>GamehubFortechdev</title>

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
  crossorigin="anonymous"
  referrerpolicy="no-referrer"
/>

<style>
/* =========================================================
   GAMEHUBFORTECHDEV — Liquid Glass
   ========================================================= */

:root{
  --blue-300:#9cc3fb;
  --blue-400:#6ba3f7;
  --glass:rgba(255,255,255,.14);
  --glass-border:rgba(255,255,255,.28);
  --text:#f4f9ff;
  --text-dim:rgba(244,249,255,.72);
  --text-soft:rgba(244,249,255,.52);
  --radius-m:18px;
  --radius-l:24px;
  --radius-card:20px;
  --ease:cubic-bezier(.22,.9,.28,1);
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;scroll-behavior:smooth}
body{
  font-family:'Segoe UI',system-ui,-apple-system,'SF Pro Display','Helvetica Neue',Arial,sans-serif;
  background:#0a1e3d;
  color:var(--text);
  min-height:100vh;
  min-height:100dvh;
  overflow-x:hidden;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
img,svg,video,canvas{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:inherit;text-decoration:none}
i.fa-solid,i.fa-regular,i.fa-brands{line-height:1}

/* =========================================================
   VIDEO BACKGROUND
   ========================================================= */
.bg-video{
  position:fixed;
  inset:0;
  width:100%;height:100%;
  object-fit:cover;
  z-index:-3;
  pointer-events:none;
}
.bg-tint{
  position:fixed;inset:0;
  z-index:-2;pointer-events:none;
  background:
    radial-gradient(120% 90% at 50% 0%, rgba(10,30,61,.18) 0%, rgba(10,30,61,.52) 60%, rgba(6,20,42,.78) 100%),
    linear-gradient(180deg, rgba(15,40,80,.26) 0%, rgba(8,24,50,.42) 55%, rgba(6,18,38,.70) 100%);
}
.bg-vignette{
  position:fixed;inset:0;
  z-index:-1;pointer-events:none;
  background:linear-gradient(180deg, rgba(0,0,0,.10) 0%, transparent 30%, transparent 65%, rgba(0,0,0,.35) 100%);
}

/* =========================================================
   LAYOUT
   ========================================================= */
.shell{
  max-width:1100px;
  margin:0 auto;
  padding:calc(var(--safe-t) + 22px) calc(var(--safe-r) + 16px) calc(var(--safe-b) + 32px) calc(var(--safe-l) + 16px);
  position:relative;
  z-index:1;
}

.glass{
  position:relative;
  background:var(--glass);
  backdrop-filter:blur(14px) saturate(1.6);
  -webkit-backdrop-filter:blur(14px) saturate(1.6);
  border:1px solid var(--glass-border);
  box-shadow:
    0 8px 24px rgba(2,10,25,.28),
    inset 0 1px 0 rgba(255,255,255,.35),
    inset 0 -1px 0 rgba(255,255,255,.06);
  contain:paint;
}
.glass::before{
  content:"";
  position:absolute;left:0;right:0;top:0;
  height:42%;border-radius:inherit;
  background:linear-gradient(180deg, rgba(255,255,255,.22) 0%, rgba(255,255,255,.04) 55%, transparent 100%);
  pointer-events:none;z-index:0;
}
.glass > *{position:relative;z-index:1}

/* =========================================================
   TOPBAR
   ========================================================= */
.topbar{
  display:flex;align-items:center;gap:11px;
  padding:10px 14px;
  border-radius:var(--radius-m);
  margin-bottom:26px;
}
.brand-mark{
  width:36px;height:36px;
  border-radius:11px;
  display:grid;place-items:center;
  background:linear-gradient(135deg, rgba(107,163,247,.9), rgba(29,78,216,.9));
  box-shadow:
    0 6px 16px rgba(37,99,235,.45),
    inset 0 1px 0 rgba(255,255,255,.5),
    inset 0 -2px 6px rgba(0,0,0,.18);
  flex:none;color:#fff;
  border:1px solid rgba(255,255,255,.35);
}
.brand-mark i{font-size:15px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.brand-title{
  font-size:14.5px;font-weight:800;letter-spacing:-.2px;
  color:#fff;
  text-shadow:0 1px 2px rgba(0,0,0,.35);
}

/* =========================================================
   HERO
   ========================================================= */
.hero{
  padding:8px 4px 26px;
  text-align:center;
}
.hero h1{
  font-size:clamp(28px,8vw,48px);
  line-height:1.08;
  letter-spacing:-1.3px;
  font-weight:800;
  color:#fff;
  margin-bottom:12px;
  text-shadow:0 2px 18px rgba(0,0,0,.45), 0 1px 3px rgba(0,0,0,.55);
  animation:fadeUp .6s var(--ease) both;
}
.hero h1 .grad{
  background:linear-gradient(120deg,#c5ddfd 0%,#6ba3f7 45%,#9cc3fb 100%);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
  display:inline-block;
  filter:drop-shadow(0 2px 10px rgba(107,163,247,.45));
}
.hero p{
  max-width:480px;
  margin:0 auto;
  font-size:clamp(13px,3.2vw,14.5px);
  color:var(--text-dim);
  line-height:1.6;
  text-shadow:0 1px 3px rgba(0,0,0,.45);
  animation:fadeUp .6s .06s var(--ease) both;
}

/* =========================================================
   GRID — Mobile 2-col compact, Tablet 2-col, Desktop 3-col
   ========================================================= */
.grid{
  display:grid;
  grid-template-columns:repeat(2, minmax(0, 1fr));
  gap:10px;
  margin-bottom:24px;
}
@media(min-width:640px){
  .grid{grid-template-columns:repeat(2, minmax(0, 1fr));gap:14px}
}
@media(min-width:940px){
  .grid{grid-template-columns:repeat(3, minmax(0, 1fr));gap:16px}
}

/* =========================================================
   CARD
   ========================================================= */
.card{
  position:relative;
  display:flex;flex-direction:column;
  border-radius:var(--radius-card);
  padding:16px;
  overflow:hidden;
  isolation:isolate;
  transition:transform .4s var(--ease), box-shadow .4s var(--ease), border-color .4s var(--ease);
  animation:fadeUp .55s var(--ease) both;
  background:rgba(255,255,255,.12);
  backdrop-filter:blur(14px) saturate(1.55);
  -webkit-backdrop-filter:blur(14px) saturate(1.55);
  border:1px solid rgba(255,255,255,.25);
  box-shadow:
    0 10px 28px rgba(2,10,25,.32),
    inset 0 1px 0 rgba(255,255,255,.40),
    inset 0 -1px 0 rgba(255,255,255,.05);
  contain:paint;
  -webkit-tap-highlight-color:transparent;
  min-height:150px;
}
.card:nth-child(1){animation-delay:.08s}
.card:nth-child(2){animation-delay:.13s}
.card:nth-child(3){animation-delay:.18s}
.card:nth-child(4){animation-delay:.23s}
.card:nth-child(5){animation-delay:.28s}
.card:nth-child(6){animation-delay:.33s}
.card:nth-child(7){animation-delay:.38s}
.card:nth-child(8){animation-delay:.43s}
.card:nth-child(9){animation-delay:.48s}

.card::before{
  content:"";
  position:absolute;left:0;right:0;top:0;
  height:45%;border-radius:inherit;
  background:linear-gradient(180deg, rgba(255,255,255,.28) 0%, rgba(255,255,255,.06) 55%, transparent 100%);
  pointer-events:none;z-index:0;
}
.card::after{
  content:"";
  position:absolute;top:-40%;right:-30%;
  width:160px;height:160px;border-radius:50%;
  background:radial-gradient(circle,var(--accent,rgba(107,163,247,.6)) 0%, transparent 70%);
  opacity:.55;filter:blur(20px);
  transition:opacity .5s var(--ease), transform .6s var(--ease);
  pointer-events:none;z-index:0;
}
.card > *{position:relative;z-index:1}

.card:active{transform:scale(.972)}
@media(hover:hover){
  .card:hover{
    transform:translateY(-4px);
    box-shadow:
      0 18px 40px rgba(2,10,25,.42),
      inset 0 1px 0 rgba(255,255,255,.48),
      inset 0 -1px 0 rgba(255,255,255,.06);
    border-color:rgba(255,255,255,.38);
  }
  .card:hover::after{opacity:.85;transform:scale(1.15) translate(-6px,6px)}
}

/* ---- Icon ---- */
.card-icon{
  width:44px;height:44px;
  border-radius:14px;
  display:grid;place-items:center;
  background:linear-gradient(140deg,var(--accent-a,#6ba3f7),var(--accent-b,#1d4ed8));
  box-shadow:
    0 8px 20px -4px var(--accent-shadow,rgba(37,99,235,.75)),
    inset 0 1px 0 rgba(255,255,255,.5),
    inset 0 -3px 8px rgba(0,0,0,.20);
  transition:transform .5s var(--ease);
  color:#fff;
  border:1px solid rgba(255,255,255,.30);
  margin-bottom:14px;
  flex:none;
}
.card-icon i{font-size:19px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.28))}
.card:active .card-icon{transform:rotate(-6deg) scale(.94)}
@media(hover:hover){.card:hover .card-icon{transform:rotate(-8deg) scale(1.06)}}

/* ---- Text ---- */
.card h3{
  font-size:15px;
  font-weight:800;
  letter-spacing:-.2px;
  line-height:1.25;
  margin-bottom:5px;
  color:#fff;
  text-shadow:0 1px 3px rgba(0,0,0,.45);
}
.card p{
  font-size:11.5px;
  line-height:1.5;
  color:var(--text-dim);
  margin-bottom:14px;
  text-shadow:0 1px 2px rgba(0,0,0,.35);
  flex:1;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

/* ---- Foot / play ---- */
.card-foot{
  display:flex;align-items:center;justify-content:space-between;
  gap:8px;
  margin-top:auto;
}
.card-play{
  display:inline-flex;align-items:center;gap:6px;
  font-size:11.5px;font-weight:800;
  padding:7px 13px;border-radius:10px;
  color:#fff;
  background:linear-gradient(135deg,var(--accent-a,#6ba3f7),var(--accent-b,#1d4ed8));
  box-shadow:
    0 6px 16px -3px var(--accent-shadow,rgba(37,99,235,.7)),
    inset 0 1px 0 rgba(255,255,255,.45);
  border:1px solid rgba(255,255,255,.28);
  transition:transform .3s var(--ease);
  margin-left:auto;
}
.card:active .card-play{transform:scale(.95)}
.card-play i{font-size:9.5px}
.card-play .fa-arrow-right{transition:transform .3s var(--ease)}
@media(hover:hover){
  .card:hover .card-play .fa-arrow-right{transform:translateX(3px)}
}

/* Tablet+ : kasih sedikit lebih besar */
@media(min-width:640px){
  .card{padding:20px;border-radius:var(--radius-l);min-height:170px}
  .card-icon{width:50px;height:50px;border-radius:15px;margin-bottom:16px}
  .card-icon i{font-size:21px}
  .card h3{font-size:17px;margin-bottom:6px}
  .card p{font-size:12.5px;margin-bottom:16px}
  .card-play{font-size:12px;padding:9px 15px;border-radius:11px}
}
@media(min-width:940px){
  .card{padding:22px}
  .card h3{font-size:18px}
  .card p{font-size:13px}
}

/* =========================================================
   ACCENT VARIANTS
   ========================================================= */
.card[data-accent="snake"]{
  --accent-a:#4ade80; --accent-b:#0ea56b;
  --accent:rgba(34,197,94,.55);
  --accent-shadow:rgba(14,165,107,.70);
}
.card[data-accent="g2048"]{
  --accent-a:#6ba3f7; --accent-b:#1d4ed8;
  --accent:rgba(107,163,247,.60);
  --accent-shadow:rgba(29,78,216,.70);
}
.card[data-accent="breakout"]{
  --accent-a:#f0a95c; --accent-b:#d94f6b;
  --accent:rgba(240,140,90,.55);
  --accent-shadow:rgba(217,79,107,.65);
}
.card[data-accent="purple"]{
  --accent-a:#a78bfa; --accent-b:#6d28d9;
  --accent:rgba(139,92,246,.55);
  --accent-shadow:rgba(109,40,217,.68);
}
.card[data-accent="cyan"]{
  --accent-a:#22d3ee; --accent-b:#0e7490;
  --accent:rgba(34,211,238,.55);
  --accent-shadow:rgba(14,116,144,.68);
}
.card[data-accent="pink"]{
  --accent-a:#f472b6; --accent-b:#be185d;
  --accent:rgba(244,114,182,.55);
  --accent-shadow:rgba(190,24,93,.65);
}

/* =========================================================
   FOOTER
   ========================================================= */
.footer{
  text-align:center;
  padding:20px 10px 4px;
  font-size:11px;
  font-weight:600;
  color:var(--text-soft);
  letter-spacing:.3px;
  text-shadow:0 1px 2px rgba(0,0,0,.4);
}

/* =========================================================
   ANIMATIONS
   ========================================================= */
@keyframes fadeUp{
  from{opacity:0;transform:translateY(14px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes ripple{
  from{transform:scale(0);opacity:.9}
  to{transform:scale(1);opacity:0}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
  }
  .card:hover{transform:none !important}
}

@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))){
  .card{background:rgba(20,40,75,.62)}
  .topbar{background:rgba(20,40,75,.55)}
}
</style>
</head>

<body>

<video class="bg-video" autoplay muted loop playsinline preload="auto">
  <source src="./wp.mp4" type="video/mp4" />
  <source src="wp.mp4" type="video/mp4" />
  <source src="/wp.mp4" type="video/mp4" />
</video>
<div class="bg-tint"></div>
<div class="bg-vignette"></div>

<main class="shell">

  <header class="topbar glass">
    <div class="brand-mark">
      <i class="fa-solid fa-shield-halved" aria-hidden="true"></i>
    </div>
    <div class="brand-title">GamehubFortechdev</div>
  </header>

  <section class="hero">
    <h1>Gamehub<span class="grad">Fortechdev</span></h1>
    <p>Pilih game favoritmu dan langsung mainkan di browser.</p>
  </section>

  <section class="grid">

    <a class="card" href="snake.html" data-accent="snake">
      <div class="card-icon">
        <i class="fa-solid fa-gamepad" aria-hidden="true"></i>
      </div>
      <h3>Neon Snake</h3>
      <p>Makan apel, jangan tabrak ekor sendiri.</p>
      <div class="card-foot">
        <span class="card-play">
          Main
          <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
        </span>
      </div>
    </a>

    <a class="card" href="g2048.html" data-accent="g2048">
      <div class="card-icon">
        <i class="fa-solid fa-table-cells-large" aria-hidden="true"></i>
      </div>
      <h3>2048 Merge</h3>
      <p>Gabungkan angka yang sama sampai dapat 2048.</p>
      <div class="card-foot">
        <span class="card-play">
          Main
          <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
        </span>
      </div>
    </a>

    <a class="card" href="breakout.html" data-accent="breakout">
      <div class="card-icon">
        <i class="fa-solid fa-layer-group" aria-hidden="true"></i>
      </div>
      <h3>Brick Breaker</h3>
      <p>Pantulkan bola, hancurkan semua bata.</p>
      <div class="card-foot">
        <span class="card-play">
          Main
          <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
        </span>
      </div>
    </a>

  </section>

  <footer class="footer">© 2026 FortechDev</footer>

</main>

<script>
(function () {
  'use strict';

  const cards = document.querySelectorAll('.card');
  const style = document.createElement('style');
  style.textContent = `
    .fx-ripple{
      position:absolute;border-radius:50%;pointer-events:none;z-index:2;
      background:radial-gradient(circle, rgba(255,255,255,.45) 0%, rgba(255,255,255,0) 70%);
      transform:scale(0);opacity:.9;
      animation:ripple .55s cubic-bezier(.22,.9,.28,1) forwards;
    }
  `;
  document.head.appendChild(style);

  cards.forEach((card) => {
    card.addEventListener('pointerdown', (e) => {
      const rect = card.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height) * 1.4;
      const r = document.createElement('span');
      r.className = 'fx-ripple';
      r.style.left = (e.clientX - rect.left - size / 2) + 'px';
      r.style.top  = (e.clientY - rect.top  - size / 2) + 'px';
      r.style.width = size + 'px';
      r.style.height = size + 'px';
      card.appendChild(r);
      setTimeout(() => r.remove(), 600);
    }, { passive: true });
  });

  const isFine = window.matchMedia('(hover:hover) and (pointer:fine)').matches;
  if (isFine) {
    let ticking = false, pendingCard = null, px = 0, py = 0;
    const apply = () => {
      ticking = false;
      if (!pendingCard) return;
      pendingCard.style.transform =
        `translateY(-4px) rotateX(${(-py * 4).toFixed(2)}deg) rotateY(${(px * 4).toFixed(2)}deg)`;
    };
    cards.forEach((card) => {
      card.style.transformStyle = 'preserve-3d';
      card.addEventListener('pointerenter', () => { card.style.willChange = 'transform'; }, { passive: true });
      card.addEventListener('pointermove', (e) => {
        const r = card.getBoundingClientRect();
        pendingCard = card;
        px = (e.clientX - r.left) / r.width - 0.5;
        py = (e.clientY - r.top) / r.height - 0.5;
        if (!ticking) { ticking = true; requestAnimationFrame(apply); }
      }, { passive: true });
      card.addEventListener('pointerleave', () => {
        card.style.transform = '';
        card.style.willChange = 'auto';
        if (pendingCard === card) pendingCard = null;
      }, { passive: true });
    });
  }

  const prefetch = () => {
    document.querySelectorAll('a.card').forEach((a) => {
      const href = a.getAttribute('href');
      if (!href) return;
      const link = document.createElement('link');
      link.rel = 'prefetch';
      link.href = href;
      document.head.appendChild(link);
    });
  };
  if ('requestIdleCallback' in window) requestIdleCallback(prefetch, { timeout: 2000 });
  else setTimeout(prefetch, 1400);

  const video = document.querySelector('.bg-video');
  if (video) {
    video.disablePictureInPicture = true;
    if ('playsInline' in video) video.playsInline = true;

    const tryPlay = () => {
      const p = video.play();
      if (p && typeof p.catch === 'function') {
        p.catch(() => {
          const resume = () => {
            video.play().catch(() => {});
            window.removeEventListener('touchstart', resume);
            window.removeEventListener('click', resume);
          };
          window.addEventListener('touchstart', resume, { once: true, passive: true });
          window.addEventListener('click', resume, { once: true });
        });
      }
    };
    if (video.readyState >= 2) tryPlay();
    else video.addEventListener('loadeddata', tryPlay, { once: true });

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        if (!video.paused) { video.dataset.wasPlaying = '1'; video.pause(); }
      } else if (video.dataset.wasPlaying === '1') {
        video.play().catch(() => {});
        delete video.dataset.wasPlaying;
      }
    });
  }

  let lastTouch = 0;
  document.addEventListener('touchend', (e) => {
    const now = Date.now();
    if (now - lastTouch < 320) e.preventDefault();
    lastTouch = now;
  }, { passive: false });

  document.querySelectorAll('img, video, svg').forEach((el) => el.setAttribute('draggable', 'false'));

})();
</script>
</body>
